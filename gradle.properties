# Gradle
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Configuration cache. Problems only warn while plugins are still being migrated.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC

# Android
android.useAndroidX=true

# iOS targets are off until the iOS audio engine exists. Set to true to build iOS.
justrelax.ios.enabled=false

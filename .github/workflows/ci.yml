name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        # KMP modules (AGP 9 android-kmp-library) run host tests; the app module runs regular unit tests.
        run: ./gradlew testAndroidHostTest testDebugUnitTest --continue

      - name: Database migrations
        # Every schema change needs a migration that ends in the same schema as the CREATE statements.
        run: ./gradlew :core:database:verifySqlDelightMigration

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  ios:
    # Kotlin/Native iOS tests and an unsigned simulator build of the Xcode app. Public repos get
    # macOS runners for free.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: iOS unit tests
        # Only the modules with iOS-only tests (AVFoundation); common tests already run on the
        # Android host, and linking a test binary for every module takes over an hour here.
        run: ./gradlew :core:playback:iosSimulatorArm64Test :core:media:iosSimulatorArm64Test -Pjustrelax.ios.enabled=true --continue

      - name: Swift unit tests
        # Builds the app and runs iosAppTests on the newest iPhone simulator the runner has. Ad-hoc
        # signing, as without signing the keychain is unavailable.
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for r in sorted(runtimes, reverse=True) if "iOS" in r for d in runtimes[r] if d["name"].startswith("iPhone")))
          ')
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -destination "id=$udid" \
            -only-testing:iosAppTests CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: '**/build/reports/tests/'

  api-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/api-proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/api-proxy/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  sound-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tests cover the pipeline's pure functions; ffmpeg is not needed.
      - run: python3 -m unittest discover -s tools/sound-pipeline

      # The string tools, and an iOS String Catalog that matches the Android strings.
      - run: python3 -m unittest discover -s tools/strings
      - run: python3 tools/strings/strings.py xcstrings --check
